[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mamyda-stt"
version = "0.1.0"
description = "Reusable self-hosted speech-to-text service"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
mamyda-stt-benchmark = "mamyda_stt.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
